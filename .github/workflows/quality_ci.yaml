name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
      - name: Run quality checks on all files
        uses: j178/prek-action@v3.0.1
      - name: Install dependencies
        run: |
          uv sync
      - name: Check declared dependencies with deptry
        run: |
          USE_UV=true just deps-check
