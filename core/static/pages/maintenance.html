<!DOCTYPE html>
<html data-fr-theme="light" lang="fr">

  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon/favicon.ico" type="image/x-icon">

    <title>Site en maintenance</title>
  </head>

  <body>
    <main id="content">

      <header role="banner" class="fr-header">
        <div class="fr-header__body">
          <div class="fr-container">
            <div class="fr-header__body-row">
              <div class="fr-header__brand fr-enlarge-link">
                <div class="fr-header__brand-top">
                  <div class="fr-header__logo">
                    <p class="fr-logo" title="Gouvernement">Gouvernement</p>
                  </div>
                </div>
                <div class="fr-header__service">
                  <p class="fr-header__service-title">Site en maintenance</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </header>

      <div class="fr-container fr-mt-4w fr-mb-6w">
        <div class="fr-grid-row fr-grid-row--gutters">
          <div class="fr-col-12 fr-col-md-6">
            <h1>Site en maintenance</h1>
            <p>Ce site est temporairement en maintenance. Merci de réessayer plus tard.</p>
          </div>
          <div class="fr-col-12 fr-col-md-6">
            <svg xmlns="http://www.w3.org/2000/svg"
                 class="fr-responsive-img fr-artwork"
                 aria-hidden="true"
                 width="160"
                 height="200"
                 viewBox="0 0 160 200">
              <use class="fr-artwork-motif" href="artwork/background/ovoid.svg#artwork-motif"></use>
              <use class="fr-artwork-background" href="artwork/background/ovoid.svg#artwork-background"></use>
              <g transform="translate(40, 60)">
              <use class="fr-artwork-decorative" href="artwork/pictograms/system/technical-error.svg#artwork-decorative"></use>
              <use class="fr-artwork-minor" href="artwork/pictograms/system/technical-error.svg#artwork-minor"></use>
              <use class="fr-artwork-major" href="artwork/pictograms/system/technical-error.svg#artwork-major"></use>
              </g>
            </svg>
          </div>
        </div>
      </div>

      <footer class="fr-footer fr-pb-4w" role="contentinfo" id="footer">
        <div class="fr-container">
          <div class="fr-footer__body">
            <div class="fr-footer__brand fr-enlarge-link">
              <p class="fr-logo" title="Gouvernement">Gouvernement</p>
            </div>
            <div class="fr-footer__content">
              <ul class="fr-footer__content-list">
                <li class="fr-footer__content-item">
                  <a class="fr-footer__content-link" href="https://legifrance.gouv.fr/">legifrance.gouv.fr</a>
                </li>
                <li class="fr-footer__content-item">
                  <a class="fr-footer__content-link" href="https://www.info.gouv.fr/">info.gouv.fr</a>
                </li>
                <li class="fr-footer__content-item">
                  <a class="fr-footer__content-link"
                     href="https://www.service-public.gouv.fr/">service-public.gouv.fr</a>
                </li>
                <li class="fr-footer__content-item">
                  <a class="fr-footer__content-link" href="https://data.gouv.fr/">data.gouv.fr</a>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </footer>
    </main>

  </body>

</html>
