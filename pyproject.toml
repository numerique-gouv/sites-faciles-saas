[project]
name = "sites-conformes-saas"
version = "1.3.0"
description = "Gestionnaire de déploiement pour Sites Conformes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dj-database-url>=2.3.0",
    "dj-static>=0.0.6",
    "django-two-factor-auth>=1.18.1",
    "django>=5.1.4",
    "django-csp>=3.8",
    "django-dsfr>=2.0.0",
    "gunicorn>=23.0.0",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.0.1",
    "rust-just>=1.39.0",
    "requests>=2.34.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "black>=24.10.0",
    "deptry>=0.25.1",
    "django-debug-toolbar>=4.4.6",
    "djlint>=1.36.4",
    "ipython>=8.31.0",
    "prek>=0.5.5",
    "ruff>=0.9.0",
]

[tool.uv]
required-version = ">=0.9.17"
exclude-newer = "7 days"
# Per-package opt-out: set a package to false to bypass the cooldown for an
# urgent security fix published inside the window. Example:
# exclude-newer-package = { django = false }
# certifi: GHSA-6q48-6c7w-9gw2, fixed in 2026.10.19 (remove after 2026-10-26)
exclude-newer-package = { certifi = false }

[tool.deptry]
# Migrations only re-import what the corresponding models.py already imports.
extend_exclude = [".*/migrations/"]

[tool.deptry.package_module_name_map]
# Packages whose distributed module name doesn't match deptry's default guess
# (package name with hyphens replaced by underscores).
"django-dsfr" = "dsfr"
"python-dotenv" = "dotenv"
"django-two-factor-auth" = "two_factor"

[tool.deptry.per_rule_ignores]
# Not imported directly in Python: loaded by Django via a string reference
# (INSTALLED_APPS/MIDDLEWARE) or invoked as an external process.
DEP002 = [
    "gunicorn",               # WSGI server, run as a subprocess (Procfile), never imported
    "django-csp",             # referenced by string as "csp" in INSTALLED_APPS/MIDDLEWARE
    "psycopg2-binary",        # DB driver loaded by Django from DATABASE_URL, not imported directly
    "whitenoise",             # referenced by string in MIDDLEWARE
    "rust-just",              # installs the `just` CLI binary, no Python import
]
# Dev-only import, guarded by DEBUG/localhost checks in config/urls.py
DEP004 = ["debug_toolbar"]

# Blocks installation of known malware (typosquatting, deliberately malicious packages)
[tool.uv.audit]
malware-check = true

[tool.djlint]
line_break_after_multiline_tag = true
max_blank_lines = 1
ignore = "H006"
per-file-ignores = { "core/static/pages/" = "H030" }
indent = 2

[tool.pyright]
reportAttributeAccessIssue = false # too many false positives with Django models
reportIncompatibleVariableOverride = false # too many false positives with Django models

[tool.ruff]
extend-exclude = ["migrations",]

[tool.ruff.lint]
ignore = ["RUF012"]
# RUF012 Mutable default value for class attribute
